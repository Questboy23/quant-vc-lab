# Strategies (pre-declared; lockbox once):
# L1 quality_in_cheap_half, round-4 features (pure replication on fresh years)
# L2 quality_in_cheap_half, round-4 + round-5 features
# L3 L2 with double weight on the top quarter of quality inside the cheap half
# L4 second-raise momentum: buy at the second raise when it is >= 2x the first and within 18 months
# L5 second-raise contrarian: buy at the second raise when it is <= 1x the first and within 18 months
