# Quant VC Lab hypothesis registry. Registered BEFORE any test-window result was computed
# (2026-09-30). `result` blocks are written back by analysis/run_all.py; do not hand-edit them.
#
# kind:      logit   -> logistic regression on TEST cohorts 2008-2010 with cohort-year fixed
#                       effects + log first-round size + stage dummies (+ `controls`)
#            spline  -> likelihood-ratio test of a 3-df natural spline in `feature`
#            returns -> bespoke price-adjusted multiple comparison (see analysis/hypotheses.py)
# direction: + / - / two   (the sign the intuition predicts; two = no prior sign)
# primary:   the ONE pre-registered outcome that decides pass/fail. Other outcomes are shown.
# Holm correction is applied across every primary test in this file together.
# ---------------- spec hypotheses ----------------
# ---------------- own hypotheses ----------------

- id: P1
  source: prior
  name: Smart money
  intuition: Top-40 investors by train-period success rate pick (or make) winners.
  feature: smart_money
  definition: Any of the 40 highest-success investors (>=10 train companies) is in the first round.
  kind: logit
  primary: bigwin
  direction: +
  result:
    verdict: no evidence
    primary_outcome: bigwin
    effect: 0.2681
    effect_units: log-odds per SD (or per unit if binary)
    p_raw: 0.333
    p_holm: 1.0
    n: 3224
    events: 115
    all_outcomes:
      success:
        coef: 0.9407
        p: 2.91e-11
        n: 3224
      bigwin:
        coef: 0.2681
        p: 0.333
        n: 3224
      closed:
        coef: -0.5432
        p: 0.0152
        n: 3224
    complete_record:
      coef: 0.0858
      p: 0.771
      n: 1701
    coverage_controlled:
      coef: 0.11
      p: 0.697
    missing_share: 0.0
    missingness_predicts_outcome_p: null
    returns:
      mult_hi: 2.0835
      mult_lo: 1.1359
      n_hi: 267.0
      n_lo: 2957.0
      diff: 0.9477
      ci:
      - -0.1112
      - 2.2836
      p: 0.093
      contrast: 1 vs 0
